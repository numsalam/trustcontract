[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustcontract"
version = "0.1.0"
description = "Declarative capability contracts, signed approvals, and a tamper-evident audit log — pure Python, zero dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Numsalam (NUMAWARE)"}]
keywords = ["authorization", "capabilities", "approvals", "audit", "security", "numaware"]

[project.scripts]
trustcontract = "trustcontract.cli:main"

[tool.setuptools.packages.find]
include = ["trustcontract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
